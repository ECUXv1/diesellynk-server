<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DieselLynk — Command Bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0C0C0E; --surface:#161618; --surface2:#1E1E22;
      --border:#2A2A30; --border2:#3A3A42;
      --gold:#D4AF37; --gold2:#F0CE5E; --golddim:#7A6120;
      --text:#F0EAD6; --muted:#6A6A78;
      --green:#2ECC71; --green-bg:rgba(46,204,113,.12); --green-border:rgba(46,204,113,.3);
      --orange:#F39C12; --orange-bg:rgba(243,156,18,.1); --orange-border:rgba(243,156,18,.3);
      --blue:#5DADE2; --blue-bg:rgba(93,173,226,.1); --blue-border:rgba(93,173,226,.3);
      --red:#E74C3C; --red-bg:rgba(231,76,60,.1); --red-border:rgba(231,76,60,.35);
      --danger:#C0392B; --danger-bg:rgba(192,57,43,.1); --danger-border:rgba(192,57,43,.3);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;user-select:none;}

    /* Gold top bar */
    body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;z-index:99;background:linear-gradient(90deg,transparent,var(--golddim),var(--gold2),var(--gold),var(--gold2),var(--golddim),transparent);}

    /* ── OUTER GRID ── */
    .shell{
      display:grid;
      grid-template-columns: 200px 1fr 180px;
      height:100vh;
      padding-top:2px;
    }

    /* ── LEFT PANEL ── */
    .left{
      display:flex;flex-direction:column;justify-content:center;gap:14px;
      padding:16px 18px;
      border-right:1px solid var(--border);
      background:var(--surface);
    }
    .left-top{display:flex;flex-direction:column;gap:4px;}
    .l-label{font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
    .l-sid{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .l-ws{display:flex;align-items:center;gap:7px;font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:.1em;color:var(--muted);}
    .wsdot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .3s,box-shadow .3s;}
    .wsdot.connected{background:var(--green);box-shadow:0 0 8px var(--green);}
    .wsdot.reconnecting{background:var(--orange);animation:blink .5s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

    /* RDP button */
    .rdp-btn{
      display:none;
      flex-direction:column;align-items:center;justify-content:center;gap:6px;
      padding:14px 10px;border-radius:10px;cursor:pointer;border:1px solid var(--blue-border);
      background:var(--blue-bg);transition:all .2s;
    }
    .rdp-btn:hover{background:rgba(93,173,226,.18);border-color:var(--blue);box-shadow:0 0 20px rgba(93,173,226,.15);transform:translateY(-1px);}
    .rdp-btn:active{transform:scale(.97);}
    .rdp-icon{font-size:28px;line-height:1;}
    .rdp-label{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);text-align:center;}

    /* ── CENTER ── */
    .center{
      display:flex;flex-direction:column;
      padding:10px 12px 8px;
      gap:8px;
      min-height:0;
    }

    /* Command buttons row */
    .btns{
      display:grid;
      grid-template-columns:repeat(8,1fr);
      gap:8px;
      flex:1;
      min-height:0;
    }

    .btn{
      position:relative;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:5px;padding:0 6px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:10px;
      cursor:pointer;
      overflow:hidden;
      transition:border-color .15s,transform .1s,box-shadow .15s,background .15s;
      min-width:0;min-height:0;
    }
    .btn::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0;opacity:0;transition:opacity .2s;}
    .btn:hover::after{opacity:1;}
    .btn:hover{transform:translateY(-2px);}
    .btn:active{transform:scale(.96);}
    .btn.fired{animation:fired .35s ease;}
    @keyframes fired{0%{box-shadow:0 0 0 0 rgba(212,175,55,.9)}50%{box-shadow:0 0 0 14px rgba(212,175,55,0)}100%{box-shadow:none}}

    /* Variant colors */
    .btn-start{border-color:var(--green-border);background:var(--green-bg);}
    .btn-start::after{background:var(--green);}
    .btn-start:hover{border-color:var(--green);box-shadow:0 4px 20px rgba(46,204,113,.2);}

    .btn-ignoff{border-color:var(--orange-border);}
    .btn-ignoff::after{background:var(--orange);}
    .btn-ignoff:hover{border-color:var(--orange);background:var(--orange-bg);box-shadow:0 4px 20px rgba(243,156,18,.2);}

    .btn-ignon{border-color:rgba(212,175,55,.3);}
    .btn-ignon::after{background:var(--gold);}
    .btn-ignon:hover{border-color:var(--gold);background:rgba(212,175,55,.08);box-shadow:0 4px 20px rgba(212,175,55,.2);}

    .btn-faults{border-color:rgba(93,173,226,.25);}
    .btn-faults::after{background:var(--blue);}
    .btn-faults:hover{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 4px 20px rgba(93,173,226,.15);}

    .btn-cal{border-color:rgba(212,175,55,.25);}
    .btn-cal::after{background:var(--gold2);}
    .btn-cal:hover{border-color:var(--gold2);background:rgba(240,206,94,.06);box-shadow:0 4px 20px rgba(212,175,55,.15);}

    .btn-regen{border-color:var(--red-border);background:var(--red-bg);}
    .btn-regen::after{background:var(--red);}
    .btn-regen:hover{border-color:var(--red);box-shadow:0 4px 20px rgba(231,76,60,.25);}

    .btn-complete{border-color:var(--green-border);}
    .btn-complete::after{background:var(--green);}
    .btn-complete:hover{border-color:var(--green);background:var(--green-bg);box-shadow:0 4px 20px rgba(46,204,113,.2);}

    .btn-disc{border-color:var(--danger-border);}
    .btn-disc::after{background:var(--danger);}
    .btn-disc:hover{border-color:var(--danger);background:var(--danger-bg);box-shadow:0 4px 20px rgba(192,57,43,.2);}

    .btn-icon{font-size:clamp(20px,2.4vh,28px);line-height:1;}
    .btn-label{font-family:'Orbitron',sans-serif;font-size:clamp(7px,1vh,10px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text);text-align:center;line-height:1.3;}
    .btn-tag{font-family:'Orbitron',sans-serif;font-size:clamp(6px,.8vh,8px);letter-spacing:.08em;padding:2px 5px;border-radius:4px;border:1px solid currentColor;line-height:1;}
    .tag-warn{color:var(--orange);}
    .tag-action{color:var(--gold);}
    .tag-crit{color:var(--red);}

    /* Status strip */
    .strip{
      display:grid;
      grid-template-columns:1.2fr 2fr 0.8fr 0.8fr 0.8fr 1.5fr;
      gap:6px;
    }
    .sf{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;display:flex;flex-direction:column;gap:2px;min-width:0;}
    .sf-k{font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
    .sf-v{font-family:'Orbitron',sans-serif;font-size:clamp(9px,1.1vh,12px);font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sf-v.flash{animation:flash-val .35s ease;}
    @keyframes flash-val{0%{color:var(--gold2)}100%{color:var(--text)}}

    /* ── RIGHT PANEL ── */
    .right{
      display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:10px;
      padding:16px 16px;
      border-left:1px solid var(--border);
      background:var(--surface);
    }
    .r-label{font-family:'Orbitron',sans-serif;font-size:7px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-align:center;}
    .ack{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;padding:10px 8px;border-radius:8px;text-align:center;transition:all .3s;}
    .ack.no{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
    .ack.yes{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
    .close-btn{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:9px 8px;border:1px solid var(--border2);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;text-align:center;}
    .close-btn:hover{border-color:var(--danger);color:var(--danger);}

    .toast{position:fixed;bottom:10px;left:50%;transform:translateX(-50%) translateY(16px);z-index:999;opacity:0;transition:opacity .25s,transform .25s;font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:.15em;text-transform:uppercase;background:rgba(12,12,14,.97);border:1px solid var(--golddim);border-radius:14px;padding:7px 18px;color:var(--gold);pointer-events:none;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>
<div class="shell">

  <!-- LEFT -->
  <div class="left">
    <div class="left-top">
      <div class="l-label">Session</div>
      <div class="l-sid" id="bl-sid">--</div>
      <div class="l-ws" style="margin-top:2px;">
        <span class="wsdot" id="ws-dot"></span>
        <span id="ws-label">Connecting</span>
      </div>
    </div>
    <button id="rdp-btn" class="rdp-btn" onclick="launchRdp()">
      <span class="rdp-icon">🖥️</span>
      <span class="rdp-label">Connect RDP</span>
    </button>
  </div>

  <!-- CENTER -->
  <div class="center">

    <!-- Big buttons -->
    <div class="btns">
      <button class="btn btn-start" onclick="send('Technician Connected','Preparing Diagnostics...',false,'info',false,this)">
        <span class="btn-icon">▶️</span>
        <span class="btn-label">Start Session</span>
      </button>
      <button class="btn btn-ignoff" onclick="send('Technician Connected','Turn Ignition OFF',true,'warning',true,this)">
        <span class="btn-icon">🔴</span>
        <span class="btn-label">Ignition OFF</span>
        <span class="btn-tag tag-warn">ACK</span>
      </button>
      <button class="btn btn-ignon" onclick="send('Technician Connected','Turn Ignition ON',true,'action',true,this)">
        <span class="btn-icon">🟢</span>
        <span class="btn-label">Ignition ON</span>
        <span class="btn-tag tag-action">ACK</span>
      </button>
      <button class="btn btn-faults" onclick="send('Technician Connected','Reading Fault Codes',false,'info',false,this)">
        <span class="btn-icon">🔍</span>
        <span class="btn-label">Read Faults</span>
      </button>
      <button class="btn btn-cal" onclick="send('Technician Connected','Uploading Calibration',false,'action',false,this)">
        <span class="btn-icon">⬆️</span>
        <span class="btn-label">Upload Cal</span>
      </button>
      <button class="btn btn-regen" onclick="send('Technician Connected','Running Forced Regen',false,'critical',true,this)">
        <span class="btn-icon">🔥</span>
        <span class="btn-label">Forced Regen</span>
        <span class="btn-tag tag-crit">CRITICAL</span>
      </button>
      <button class="btn btn-complete" onclick="send('Technician Connected','Session Complete',false,'info',false,this)">
        <span class="btn-icon">✅</span>
        <span class="btn-label">Complete</span>
      </button>
      <button class="btn btn-disc" onclick="send('Technician Disconnected','Waiting for technician...',false,'info',false,this)">
        <span class="btn-icon">⏹️</span>
        <span class="btn-label">Disconnect</span>
      </button>
    </div>

    <!-- Status strip -->
    <div class="strip">
      <div class="sf"><div class="sf-k">Status</div><div class="sf-v" id="sf-status">--</div></div>
      <div class="sf"><div class="sf-k">Command</div><div class="sf-v" id="sf-command">--</div></div>
      <div class="sf"><div class="sf-k">Priority</div><div class="sf-v" id="sf-priority">--</div></div>
      <div class="sf"><div class="sf-k">Ack Req</div><div class="sf-v" id="sf-ack-req">--</div></div>
      <div class="sf"><div class="sf-k">Modal</div><div class="sf-v" id="sf-modal">--</div></div>
      <div class="sf"><div class="sf-k">Customer Message</div><div class="sf-v" id="sf-msg">--</div></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="r-label">Customer Ack</div>
    <div class="ack no" id="ack-badge">PENDING</div>
    <button class="close-btn" onclick="window.close()">✕ Close Bar</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
  const p = new URLSearchParams(location.search);
  const sessionId     = p.get('session') || '';
  const techAuthToken = p.get('auth')    || '';
  const rdpUrl        = p.get('rdp')     || '';

  document.getElementById('bl-sid').textContent = sessionId || '--';
  if (rdpUrl) document.getElementById('rdp-btn').style.display = 'flex';

  if (!sessionId || !techAuthToken) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Orbitron,sans-serif;font-size:13px;color:#6A6A78;letter-spacing:.2em;">OPEN FROM TECH PANEL</div>';
  }

  let techToken = '', ws = null, wsRecon = null, rdpWin = null;

  function launchRdp() {
    if (!rdpUrl) { showToast('RDP URL not ready'); return; }
    const sw = window.screen.availWidth, sh = window.screen.availHeight;
    const sl = window.screen.availLeft || 0, st = window.screen.availTop || 0;
    if (!rdpWin || rdpWin.closed) {
      rdpWin = window.open(rdpUrl, 'dl_rdp',
        `width=${sw},height=${Math.round(sh*.78)},left=${sl},top=${st},toolbar=no,menubar=no,scrollbars=no,resizable=yes`);
    } else rdpWin.focus();
  }

  function setWs(s) {
    const d = document.getElementById('ws-dot'), l = document.getElementById('ws-label');
    if (d) d.className = 'wsdot ' + s;
    if (l) l.textContent = s === 'connected' ? 'Live' : s === 'reconnecting' ? 'Reconnecting' : 'Offline';
  }

  function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws?session=${encodeURIComponent(sessionId)}`);
    ws.onopen    = () => { setWs('connected'); if (wsRecon) { clearTimeout(wsRecon); wsRecon = null; } };
    ws.onmessage = e => { try { applyData(JSON.parse(e.data)); } catch(_){} };
    ws.onclose   = () => { setWs('reconnecting'); wsRecon = setTimeout(connectWs, 2000); };
    ws.onerror   = () => ws.close();
  }

  async function joinSession() {
    try {
      const r = await fetch(`/api/tech-join/${encodeURIComponent(sessionId)}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tech_auth_token: techAuthToken })
      });
      if (!r.ok) return;
      const d = await r.json();
      if (d.tech_token) { techToken = d.tech_token; connectWs(); }
    } catch(_) {}
  }

  function applyData(d) {
    const set = (id, val) => {
      const el = document.getElementById(id); if (!el) return;
      if (el.textContent !== val) {
        el.textContent = val;
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      }
    };
    set('sf-status',   d.status   || '--');
    set('sf-command',  d.command  || '--');
    set('sf-priority', (d.priority || '--').toUpperCase());
    set('sf-ack-req',  d.requires_ack ? 'YES' : 'NO');
    set('sf-modal',    d.show_modal   ? 'ACTIVE' : 'OFF');
    set('sf-msg',      d.customer_message || '--');
    const ack = document.getElementById('ack-badge');
    if (ack) { ack.textContent = d.customer_ack ? 'CONFIRMED' : 'PENDING'; ack.className = 'ack ' + (d.customer_ack ? 'yes' : 'no'); }
  }

  async function send(status, command, requires_ack, priority, show_modal, btn) {
    if (!sessionId || !techToken) { showToast('Not connected'); return; }
    btn.classList.add('fired'); setTimeout(() => btn.classList.remove('fired'), 400);
    try {
      await fetch(`/api/update/${encodeURIComponent(sessionId)}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tech_token: techToken, status, command, requires_ack, priority, show_modal })
      });
      applyData({ status, command, requires_ack, priority, show_modal });
    } catch(_) { showToast('Send failed'); }
  }

  let toastT = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('show'), 2500);
  }

  if (sessionId && techAuthToken) joinSession();
</script>
</body>
</html>
