<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>DieselLynk Remote Desktop</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;}
    #screen{width:100%;height:100%;}
    #status{position:fixed;top:10px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.8);color:#D4AF37;font-family:monospace;font-size:12px;
      padding:6px 14px;border-radius:20px;border:1px solid #333;z-index:100;
      pointer-events:none;transition:opacity .5s;}
    #status.hidden{opacity:0;}
  </style>
</head>
<body>
  <div id="status">Connecting to tablet...</div>
  <div id="screen"></div>

  <script type="module">
    const params   = new URLSearchParams(location.search);
    const wsUrl    = params.get('ws');
    const vncPass  = params.get('pass') || '';
    const statusEl = document.getElementById('status');

    // If loaded without ws param (e.g. about:blank fallback), show nothing
    if (!wsUrl || wsUrl === 'about:blank') {
      document.body.style.background = '#000';
      statusEl.style.display = 'none';
    } else {
      // Ensure wss:// protocol for secure tunnels
      if (wsUrl.startsWith('https://')) {
        wsUrl = wsUrl.replace('https://', 'wss://');
      } else if (wsUrl.startsWith('http://')) {
        wsUrl = wsUrl.replace('http://', 'ws://');
      }
      // websockify expects connections at root path
      // Remove trailing slash if present
      wsUrl = wsUrl.replace(/\/$/, '');
      startVnc(wsUrl);
    }

    async function startVnc(url) {
      try {
        const { default: RFB } = await import('https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js');

        const rfb = new RFB(document.getElementById('screen'), url, {
          credentials: { password: vncPass },
        });

        rfb.scaleViewport = true;
        rfb.resizeSession = true;

        rfb.addEventListener('connect', () => {
          statusEl.textContent = '● Connected';
          setTimeout(() => statusEl.classList.add('hidden'), 2000);
        });

        rfb.addEventListener('disconnect', (e) => {
          statusEl.classList.remove('hidden');
          statusEl.textContent = e.detail.clean ? 'Disconnected' : 'Connection lost -- retrying...';
          if (!e.detail.clean) {
            setTimeout(() => startVnc(url), 3000);
          }
        });

        rfb.addEventListener('credentialsrequired', () => {
          // Auto-supply password if we have it, otherwise prompt
          if (vncPass) {
            rfb.sendCredentials({ password: vncPass });
          } else {
            const pass = prompt('VNC Password:');
            if (pass) rfb.sendCredentials({ password: pass });
          }
        });

      } catch(e) {
        statusEl.textContent = 'Failed to load VNC client: ' + e.message;
        console.warn('noVNC load error:', e);
      }
    }
  </script>
</body>
</html>
