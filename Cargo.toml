[package]
name = "diesellynk-server"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
actix = "0.13.5"
actix-files = "0.6.6"
actix-web = "4.4.0"
actix-web-actors = "4.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
