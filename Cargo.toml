[package]
name = "diesellynk-server"
version = "0.2.0"
edition = "2021"

[dependencies]
actix = "0.13.5"
actix-files = "0.6.6"
actix-web = "4.4.0"
actix-web-actors = "4.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Future additions (uncomment when ready):
# uuid = { version = "1.0", features = ["v4"] }        # better session IDs
# sqlx = { version = "0.7", features = ["sqlite", "runtime-actix-native-tls"] } # persistence
# jsonwebtoken = "9.0"                                   # JWT auth
# bcrypt = "0.15"                                        # password hashing
# tokio = { version = "1", features = ["full"] }        # async runtime
# chrono = { version = "0.4", features = ["serde"] }    # timestamps
# dotenv = "0.15"                                        # env config
